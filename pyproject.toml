[project]
name = "riff-sketcher"
version = "0.1.0"
description = "Reconstruct melodies you can hear in your head from silent tapping and drawn contours."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "numpy>=1.26",
    "pydantic>=2.7",
]

[project.optional-dependencies]
ml = [
    "torch>=2.4",
    "pretty_midi>=0.2.10",
    "mido>=1.3",
    "tqdm>=4.66",
]

[dependency-groups]
dev = [
    "pytest>=8.2",
    "httpx>=0.27",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.setuptools]
packages = ["core", "api", "ml"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
